<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile Hamburger Menu</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin: 0;
}

h1{
  text-align: center;
}

/* Top bar */
.navbar{
  background: #333;
  color: white;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar a{
  color: white;
  text-decoration: none;
  margin-right: 10px;
}

/* Hamburger button */
.hamburger{
  font-size: 24px;
  cursor: pointer;
}

/* Menu */
#menu{
  display: none;
  background: #f2f2f2;
}

#menu a{
  display: block;
  padding: 10px;
  border-bottom: 1px solid #ccc;
  text-decoration: none;
  color: black;
}

/* Desktop view */
@media (min-width: 600px){
  .hamburger{
    display: none;
  }
  #menu{
    display: block;
  }
  #menu a{
    display: inline-block;
    border: none;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <span>My Site</span>
  <span class="hamburger" onclick="toggleMenu()">☰</span>
</div>

<div id="menu">
  <a href="#">HOME</a>
  <a href="#">ABOUT US</a>
  <a href="#">BRANCH</a>

  <ul>
    <li>Chicken burger - Rs 180</li>
    <li>Veg burger - Rs 150</li>
    <li>Cheese burger - Rs 200</li>
    <li>Double cheese burger - Rs 250</li>
  </ul>
</div>

<script>
function toggleMenu(){
  var menu = document.getElementById("menu");

  if(menu.style.display === "block"){
    menu.style.display = "none";
  }else{
    menu.style.display = "block";
  }
}
</script>

</body>
</html>
