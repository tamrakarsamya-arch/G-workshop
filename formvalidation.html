<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaForm</title>
    <link rel = "stylesheet" type = "text/css" href = "javaformcss.css">
    <script rel = "stylesheet" type = "text/javascript"  src="javaformjava.js"></script>
</head>
<body>
    <form onsubmit="return formValidation()">
        <div > 
            <div class="form-wrap"> 
                <label>Name</label>
                <input type = "text" id="Name" placeholder="Enter Your Name" >
            </div> 
        </div>
        <div>
            <div class="form-wrap">
                <label>Age</label>
                <input type = "number" id="Age" placeholder="Enter Your Age"> 
            </div>
        </div>
        <div>
            <div class="form-wrap">
                <label>Date</label>
                <input type = "date" id="Date" placeholder="Enter Your Date Of Birth"> 
            </div>
        </div>
        <div>
            <div class="form-wrap">
                <label>Email</label>
                <input type="email" id="Email" placeholder="Enter Your Email">
            </div>
        </div>
        <div>
            <div class="form-wrap">
                <input type="submit" id="Submit">
            </div>
        </div> 
    </form>
    <script>
        function formValidation(){
            var fullName = document.getElementById('Name').value;
            if(fullName == ''){
                alert('Please fill Name');
                return false;
            }
            if (fullName.length <= 3){
                alert('Name should be > 3');
                return false;
            }
            var age = document.getElementById('Age').value;
            if(age == ''){
                alert('Please fill Age');
                return false
            }
            if (age.length < 12){
                alert('age should be > 12')
                return false
            }
            var date = document.getElementById('Date').value;
            if(date == ''){
                alert('Please fill Date');
                return false
            }
            var email = document.getElementById('Email').value;
            if(email == ''){
                alert('Please fill Date');
                return false
            }
            return true
        }
    </script>
</body>
</html>
