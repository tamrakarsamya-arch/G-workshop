<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hamburger Menu</title>

<style>
h1{
    text-align: center;
    color: #333;
  }


button {
  font-size: 20px;
  padding: 5px 10px;
}
@media (min-width: 600px){
  .hamburger{
    display: none;
  }
  #menu{
    display: block;
  display: none;
  background: #f2f2f2;
  width: 250px;
  padding: 10px;
  border: 1px solid #ccc;
}

  #menu a{
    display: inline-block;
    border: none;
  }
}
</style>
</head>

<body>

<h1>Hamburger Menu</h1>
<a href="home">HOME</a>
<a href="home">ABOUT US</a>
<a href="home">BRANCH</a><br>

<button onclick="toggleMenu()">Menu</button>
<div id="menu">
  <ul>
    <li>Chicken burger - Rs 180</li>
    <li>Veg burger - Rs 150</li>
    <li>Cheese burger - Rs 200</li>
    <li>Double cheese burger - Rs 250</li>
  </ul>
</div>

<script>
function toggleMenu() {
  var menu = document.getElementById("menu");

  if (menu.style.display === "block") {
    menu.style.display = "none";
  } else {
    menu.style.display = "block";
  }
}
</script>

</body>
</html>
